name: PR checks

# On every pull request to develop:
# - Tests: every server's tests and the apps' unit tests, always, whatever the pull request changes, so it
#   can be the check a pull request needs to pass before it's merged (TECHNICAL_DECISIONS §17).
# - The release build of each Android app the change touches (.github/scripts/android_apps_changed.py),
#   built and opened on an emulator (android-release-check.yml). A pull request that touches neither app
#   (docs, servers, web, iOS) skips them.

on:
  pull_request:
    branches: [develop]

# A newer push to the same pull request replaces a check still running.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The clubs server's ApplicationTest connects to docker-compose.yml's local database; the coach server's
    # tests create their own (squadify_coach_test) on the same server and drop it afterwards.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: squadify_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squadify_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      # The apps' shared tests (commonTest) run in their Android unit tests, the target the phones run.
      - run: >-
          ./gradlew :server:core:test :server:data:test :server:web:test :server:clubs:test :server:coach:test
          :core:testAndroidHostTest :app:shared:testAndroidHostTest :app:clubs:testAndroidHostTest
          :app:coach:testAndroidHostTest --no-daemon

  changes:
    runs-on: ubuntu-latest
    outputs:
      clubs: ${{ steps.apps.outputs.clubs }}
      coach: ${{ steps.apps.outputs.coach }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: apps
        run: >-
          python3 .github/scripts/android_apps_changed.py
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          | tee -a "$GITHUB_OUTPUT"

  clubs:
    needs: changes
    if: needs.changes.outputs.clubs == 'true'
    uses: ./.github/workflows/android-release-check.yml
    with:
      app: clubs

  coach:
    needs: changes
    if: needs.changes.outputs.coach == 'true'
    uses: ./.github/workflows/android-release-check.yml
    with:
      app: coach

name: Deploy production

# Manual only (workflow_dispatch) -- deliberately not on push, per the developer. Deploys the server and
# web client services to Railway's production environment via the Railway CLI (the web client built
# here first, by deploy-web.yml), using the current state
# of whichever branch is selected when the workflow is run (defaults to main). Android/iOS store
# publishing is out of scope here -- see ISSUES TO FIX.md.
#
# Requires a Railway PROJECT TOKEN (Railway dashboard -> Project Settings -> Tokens), scoped to the
# production environment, stored as the RAILWAY_TOKEN repo secret. See
# https://docs.railway.com/cli/deploying for the officially recommended pattern this follows
# (ghcr.io/railwayapp/cli container + `railway up --ci`).

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # ApplicationTest boots the real Application.module(), which unconditionally connects to Postgres
    # via DatabaseFactory.init() -- matches docker-compose.yml's local dev credentials exactly, so
    # ServerConfig's DEV fallbacks (no APP_ENV set) connect with zero extra env vars needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: squadify_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squadify_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :server:core:test :server:data:test :server:clubs:test --no-daemon

  deploy-railway-production:
    needs: test
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy server
        run: railway up --service server --ci

  # The web client is built here in Actions and Railway only serves it (deploy-web.yml), since
  # Railway's own build of it ran out of time.
  deploy-web-production:
    needs: test
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: production
    secrets: inherit

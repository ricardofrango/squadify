name: Release coach Android

# Squadify for Coaches on Google Play: builds app/coachAndroidApp's `prod` flavor as a signed App Bundle
# (com.sportssoftw.squadify.coach) and releases it to the Play production track. It runs on every merge
# of develop into main (the production release); merges to develop only build and distribute through
# Firebase (deploy-staging-coach.yml), as before.
#
# Play only accepts a bundle for an app it already knows, so the very first bundle is uploaded by hand in
# Play Console. After that, this workflow does every upload.
#
# Secrets: ANDROID_KEYSTORE_PROPERTIES and ANDROID_KEYSTORE_BASE64 (the same release keystore as the other
# workflows) and PLAY_SERVICE_ACCOUNT_JSON (a Play Console service account with release permissions on
# this app, its JSON).

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :app:shared:testAndroidHostTest :app:coach:testAndroidHostTest --no-daemon

  release:
    needs: test
    runs-on: ubuntu-latest
    # To push the release's tag (after the upload).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_PROPERTIES" > keystore/keystore.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/squadify-keystore.jks
          if [ ! -s keystore/keystore.properties ] || [ ! -s keystore/squadify-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_PROPERTIES or ANDROID_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi

      # The version code is the run number plus 1, so it only grows and every upload is newer than the last
      # one. The +1 keeps the first automatic upload above version code 1, the 1.0.0 build in review (the
      # developer, 2026-11-23: the first automatic upload is 1.0.1, version code 2). The version name is the
      # coach app's versionNameProp. The forced update's MIN_ANDROID_BUILD is set by hand on the coach server
      # when a release needs it.
      - name: Work out the version
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME=$(grep -m1 'versionNameProp = ' app/coachAndroidApp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Coach app $VERSION_NAME, version code $VERSION_CODE"

      - name: Build the signed bundle
        run: ./gradlew :app:coachAndroidApp:bundleProdRelease --no-daemon -PversionCode=$VERSION_CODE

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sportssoftw.squadify.coach
          releaseFiles: app/coachAndroidApp/build/outputs/bundle/prodRelease/*.aab
          track: production
          status: completed

      # One tag per shipped build, named by version name and code (coach-android-1.0.1-2). Tagged only after the
      # upload worked; a re-run that finds its tag already there does nothing.
      - name: Tag the release
        run: |
          TAG="coach-android-${VERSION_NAME}-${VERSION_CODE}"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Coach app $VERSION_NAME (version code $VERSION_CODE), released to Google Play production"
          git push origin "$TAG"

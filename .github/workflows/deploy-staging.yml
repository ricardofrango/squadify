name: Deploy staging

# Railway's server and web client services deploy on their own -- each is connected directly to this
# repo/branch in the Railway dashboard (Settings -> Source), with auto-deploy on. That's simpler and
# more reliable than reimplementing it here via the Railway CLI. This workflow only covers the piece
# Railway has nothing to do with: building the Android app's `staging` flavor and pushing it to Firebase
# App Distribution. See TECHNICAL_DECISIONS.md's "Environment-Based App Config" section for what
# "staging" means for each client.

on:
  push:
    branches: [develop]
    # Only Android/shared-KMP changes actually affect what this workflow builds and distributes --
    # without this, a server-only or web-only push still rebuilds and redistributes an unchanged APK
    # to every tester. Keep in sync with what app/androidApp's build actually depends on: app/shared
    # and core (KMP modules it consumes), the version catalog/wrapper/root build files, and this
    # workflow file itself (so an edit to the filter/steps takes effect on the same push).
    paths:
      - "app/androidApp/**"
      - "app/shared/**"
      - "core/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy-staging.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # ApplicationTest boots the real Application.module(), which unconditionally connects to Postgres
    # via DatabaseFactory.init() -- matches docker-compose.yml's local dev credentials exactly, so
    # ServerConfig's DEV fallbacks (no APP_ENV set) connect with zero extra env vars needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: squadify_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d squadify_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :server:test --no-daemon

  firebase-distribute-android-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      # firebase-service-account.json is gitignored (never committed -- see TECHNICAL_DECISIONS.md's
      # EmailService/Firebase sections for why secrets never go in the repo); written from a GitHub
      # secret to the exact path app/androidApp/build.gradle.kts already expects. Passed through an env
      # var and written with printf (not interpolated straight into the run script) so the multi-line
      # JSON survives intact regardless of quoting/special characters in the key.
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > app/androidApp/firebase-service-account.json
          if [ ! -s app/androidApp/firebase-service-account.json ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is empty or not set"
            exit 1
          fi

      # keystore/keystore.properties and keystore/squadify-keystore.jks are gitignored -- same pattern
      # as the Firebase service account above. Without these, app/androidApp/build.gradle.kts falls back
      # to debug-signing the release APK, which is installable but not what real release builds should
      # ship with. ANDROID_KEYSTORE_BASE64 is the .jks file's contents run through `base64` (macOS:
      # `base64 -i keystore/squadify-keystore.jks | pbcopy`; Linux: `base64 -w0 keystore/squadify-keystore.jks`).
      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_PROPERTIES" > keystore/keystore.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/squadify-keystore.jks
          if [ ! -s keystore/keystore.properties ] || [ ! -s keystore/squadify-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_PROPERTIES or ANDROID_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi

      # The Firebase App Distribution plugin's upload task only uploads -- it doesn't build the APK
      # itself, per Firebase's own docs ("./gradlew assembleRelease appDistributionUploadRelease").
      # Both tasks must run in the same invocation or the upload task fails with "Could not find an
      # APK file for this variant".
      #
      # -PversionCode=${{ github.run_number }}: this workflow's own run number, which auto-increments on
      # every run -- gives every staging build a unique, strictly-increasing versionCode and a distinct
      # "-stg.<n>" versionName suffix (see app/androidApp/build.gradle.kts), so two different staging
      # deploys are never visually identical to a tester again. See TECHNICAL_DECISIONS.md's versioning
      # section.
      - run: ./gradlew :app:androidApp:assembleStagingRelease :app:androidApp:appDistributionUploadStagingRelease --no-daemon -PversionCode=${{ github.run_number }}

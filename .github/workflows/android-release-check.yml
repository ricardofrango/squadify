name: Android release check

# Builds an Android app's staging release (shrunk by R8, as testers and the store get it), installs it on an
# emulator and opens it: fails if it crashes or isn't running after a while. Debug builds aren't shrunk, so a
# library whose R8 rules fall short only breaks a release build: the coach app's ads library did (#212).
# Called by pr-checks.yml on pull requests and by the deploy workflows before they publish, for the apps
# the change touches (.github/scripts/android_apps_changed.py). TECHNICAL_DECISIONS §17.
#
# Signed with the debug key (no keystore here) and without uploading the mapping file to Crashlytics:
# the build is only opened, never published.

on:
  workflow_call:
    inputs:
      app:
        description: "clubs or coach"
        type: string
        required: true

jobs:
  start-release-build:
    name: ${{ inputs.app }} release build starts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODULE: ${{ inputs.app == 'coach' && 'coachAndroidApp' || 'androidApp' }}
      APP_ID: ${{ inputs.app == 'coach' && 'com.ricardofrango.squadify.coach.stg' || 'com.ricardofrango.squadify.stg' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Build the staging release
        run: >-
          ./gradlew :app:$MODULE:assembleStagingRelease
          -x :app:$MODULE:uploadCrashlyticsMappingFileStagingRelease --no-daemon

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google APIs image: Google Play services, which Firebase, the ads and billing look for.
      - name: Open it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/start-release-apk.sh app/$MODULE/build/outputs/apk/staging/release/$MODULE-staging-release.apk $APP_ID

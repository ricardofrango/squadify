server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
    gzip_min_length 1024;

    # Written at container start from API_BASE_URL: never cached, so a changed server takes effect at once.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

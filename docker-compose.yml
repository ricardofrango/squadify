services:
  # Local dev database, matching ServerConfig.kt's DEV defaults (host=localhost, port=5432,
  # user=postgres, password=postgres, db=squadify_dev) so `./gradlew :server:clubs:run` works with no
  # further setup beyond `docker compose up -d`. Not used in production -- see README/
  # TECHNICAL_DECISIONS.md §3 for the real deployment's connection details (DATABASE_HOST/
  # DATABASE_PASSWORD etc., required explicitly when APP_ENV=production).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squadify_dev
    ports:
      - "5432:5432"
    volumes:
      - squadify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squadify_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  squadify_postgres_data:

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.ignoreDeprecatedHost=true

# Versioning
# Single source of truth for the app/server's human-facing semantic version -- bumped manually,
# deliberately, when you actually want to call something "1.2.0". Read by app/androidApp/build.gradle.kts
# (versionName) and server/build.gradle.kts (version), so the two can no longer drift by hand-editing one
# and forgetting the other. The build NUMBER (Android's versionCode, distinct from this) is computed
# separately per CI build so it auto-increments on every deploy without needing this bumped too -- see
# TECHNICAL_DECISIONS.md's versioning section.
VERSION_NAME=1.2.0